name: pages

# サイトの公開。コードを push したとき、および fetch / manual-add の後に呼ばれる
# （Actions が GITHUB_TOKEN で push しても他のワークフローは起動しないため、明示的に呼び出す）
on:
  push:
    branches: [main]
    paths-ignore: ['data/**']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # 直前のジョブがコミットしたデータを含める
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
