name: pages

# サイトの公開。コードを push したとき、および fetch / manual-add の後に呼ばれる
# （Actions が GITHUB_TOKEN で push しても他のワークフローは起動しないため、明示的に呼び出す）
on:
  push:
    branches: [main]
    paths-ignore: ['data/**']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # deploy-pages が成果物の一覧を取得するため
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# アップロードと公開を別ジョブに分ける。同じジョブ内で続けて実行すると、
# アップロード直後の成果物を deploy-pages が見つけられず失敗することがあった
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # 直前のジョブがコミットしたデータを含める
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
