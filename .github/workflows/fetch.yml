name: fetch

# 定期実行（schedule）は時刻どおりに起動しなかったため使わない。
# Actions 画面の Run workflow（または gh workflow run fetch）で手動実行する。
# 入力なしで、前回取得したポスト（data/state.json の since_id）以降の差分だけを取る
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test parser
        run: npm test
      - name: Fetch posts from X API
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_USER_ID: ${{ vars.X_USER_ID }}
        run: node scripts/fetch.mjs
      - name: Commit data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --cached --quiet || git commit -m "data: fetch $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push

  deploy:
    needs: fetch
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
