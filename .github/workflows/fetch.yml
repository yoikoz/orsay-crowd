name: fetch

# 定期実行（schedule）は時刻どおりに起動しなかったため使わない。
# サイトの「最新を取得」ボタン（worker/ の Cloudflare Worker 経由、1時間に1回まで）か、Actions 画面から手動で実行する
on:
  workflow_dispatch:
    inputs:
      start_time:
        description: 'since_id が未保存のときの取得開始（例: 2026-11-01T00:00:00+09:00）。空なら当日0時(JST)'
        required: false
        default: ''
      backfill:
        description: '過去分を取り込む（since_id を無視。start_time が空なら API で遡れる最大 3200件まで）'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test parser
        run: npm test
      - name: Fetch posts from X API
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_USER_ID: ${{ vars.X_USER_ID }}
          START_TIME: ${{ inputs.start_time }}
          BACKFILL: ${{ inputs.backfill }}
        run: node scripts/fetch.mjs
      - name: Commit data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --cached --quiet || git commit -m "data: fetch $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push

  deploy:
    needs: fetch
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
